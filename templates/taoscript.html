<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thay selector trong script.js</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}
    label{display:block;margin:10px 0 4px}
    input[type=text]{width:100%;padding:6px}
    textarea{width:100%;height:300px;margin-top:10px}
    .row{display:flex;gap:8px}
    button{padding:8px 12px}
  </style>
</head>
<body>
 
  <input id="file" type="file" accept=".js" hidden> 

  <textarea id="input" placeholder="Dán hoặc bỏ qua nếu đã chọn file..." hidden>
    (function(){
  function sanitizeFilename(name){
    if (!name) return 'output';
    return name.replace(/[<>:"\/\\|?*\x00-\x1F]+/g,'').trim() || 'output';
  }

  function normalizeHTML(html){
    // 2+ <br> => newline; single <br> => space
    html = html.replace(/(\s*<br\s*\/?>\s*){2,}/gi, '\n');
    html = html.replace(/<br\s*\/?>/gi, ' ');
    return html;
  }

  function downloadOrFallback(filename, text){
    try{
      var blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    }catch(e){
      console.warn('Download blocked, copying content to clipboard instead.', e);
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          console.log('Content copied to clipboard.');
        }, function(err){
          console.error('Failed to copy to clipboard:', err);
          console.log('---- FILE:', filename, '----\n' + text);
        });
      }else{
        console.log('---- FILE:', filename, '----\n' + text);
      }
    }
  }

  var nameNode = document.querySelector('div.tên[calculated="true"]');
  var baseName = sanitizeFilename(nameNode ? nameNode.textContent : 'output');
  var contentNodes = Array.from(document.querySelectorAll('div.nộidung[calculated="true"]'));
  if (!contentNodes.length){ console.warn('Extractor: Không tìm thấy thẻ div.content[calculated=\"true\"].'); return; }

  contentNodes.forEach(function(node, idx){
    var style = node.getAttribute('style') || '';
    if (!/font-family\s*:\s*arial/i.test(style)) return; // chỉ xử lý font-family: arial
    var h = node.innerHTML;
    h = normalizeHTML(h);
    var tmp = document.createElement('div'); tmp.innerHTML = h;
    var text = tmp.textContent.replace(/\u00A0/g,' ').split('\n').map(function(s){ return s.replace(/\s+/g,' ').trim(); }).join('\n').trim();
    var filename = baseName + (contentNodes.length>1 ? ('-' + (idx+1)) : '') + '.txt';
    downloadOrFallback(filename, text);
  });

  // After downloads, wait 2 seconds then try to click the next-chapter link
  setTimeout(function(){
    try{
      var next = document.querySelector('a.chuyển chương[calculated="true"]');
      if (!next){ console.warn('Extractor: no next-chapter link found to click.'); return; }
      try{ next.click(); }
      catch(e){
        // fallback: navigate to href
        var href = next.getAttribute('href');
        if (href) location.href = new URL(href, location.href).href;
      }
    }catch(err){ console.error('Extractor: error while trying to click next link', err); }
  }, 2000);
})();
  </textarea>

  <label>Thay cho <strong>tên truyện</strong></label>
  <input id="replace1" type="text" value="name">

  <label>Thay cho <strong>nộidung</strong> </label>
  <input id="replace2" type="text" value="content">

  <label>Thay cho <strong>chuyển chương</strong> </label>
  <input id="replace3" type="text" value="next-chapter">

  <div class="row" style="margin-top:12px">
    <button id="doReplace">Thay &amp; Sao chép</button>
    <button id="download" disabled>tải luyên tiểu thuyết tổng chap txt</button>
  </div>

  <div id="msg" style="margin-top:8px;color:green"></div>
  <label style="margin-top:10px">Kết quả (preview):</label>
  <textarea id="output" readonly></textarea>

<script>
// Hàm thay 1 lần (first occurrence)
function replaceOnce(str, regex, repl){
  const m = str.match(regex);
  if(!m) return str;
  const idx = m.index;
  return str.slice(0, idx) + str.slice(idx).replace(regex, repl);
}

function makeDownload(text, filename){
  const blob = new Blob([text], {type:'text/javascript'});
  const url = URL.createObjectURL(blob);
  return {url:url, blob:blob};
}

document.getElementById('file').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){ document.getElementById('input').value = r.result; };
  r.readAsText(f);
});

document.getElementById('doReplace').addEventListener('click', async function(){
  let src = document.getElementById('input').value;
  if(!src){ alert('Vui lòng chọn file hoặc dán nội dung vào ô trên.'); return; }

  const a = document.getElementById('replace1').value || '';
  const b = document.getElementById('replace2').value || '';
  const c = document.getElementById('replace3').value || '';

  // Các mẫu gốc chính xác cần thay (chỉ thay chỗ đã đánh dấu)
  // Lưu ý: tìm lần đầu xuất hiện mỗi mẫu trong file
  const orig1 = /div\.tên\[calculated="true"\]/;
  const repl1 = 'div.' + a + '[calculated="true"]';

  const orig2 = /div\.nộidung\[calculated="true"\]/;
  const repl2 = 'div.' + b + '[calculated="true"]';

  const orig3 = /a\.chuyển chương\[calculated="true"\]/;
  const repl3 = 'a.' + c + '[calculated="true"]';

  // Thay lần lượt, mỗi mẫu chỉ 1 occurrence
  let out = replaceOnce(src, orig1, repl1);
  out = replaceOnce(out, orig2, repl2);
  out = replaceOnce(out, orig3, repl3);

  // Cập nhật preview
  document.getElementById('output').value = out;
  document.getElementById('msg').textContent = 'Đã thay (chỉ 3 chỗ). Đang sao chép vào clipboard...';

  try{
    await navigator.clipboard.writeText(out);
    document.getElementById('msg').textContent = 'Đã sao chép nội dung đã sửa vào clipboard.';
  }catch(e){
    document.getElementById('msg').textContent = 'Không thể copy tự động: ' + e + '. Bạn có thể sao chép thủ công từ ô preview.';
    document.getElementById('msg').style.color = 'orange';
  }

  // Kích hoạt nút download
  const f = makeDownload(out, 'script.modified.js');
  const dl = document.getElementById('download');
  dl.disabled = false;
  dl.onclick = function(){
    const a = document.createElement('a');
    a.href = f.url;
    a.download = 'script.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(f.url), 500);
  };
});
</script>
</body>
</html>
